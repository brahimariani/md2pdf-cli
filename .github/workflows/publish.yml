name: Publish to NPM

# Le workflow se déclenche uniquement lorsqu'un tag commençant par 'v' est poussé
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # À adapter selon votre projet
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🛠️ Build du projet (si applicable)
        run: npm run build --if-present

      - name: 🚀 Publication sur NPM
        run: npm publish --access public
        env:
          # GitHub injecte automatiquement le secret configuré à l'étape 2
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}